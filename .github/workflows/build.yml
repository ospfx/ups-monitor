name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  package:
    name: Package ${{ matrix.format }}
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: apk
            sdk_base: https://downloads.openwrt.org/snapshots/targets/x86/64/
          - format: ipk
            sdk_base: https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Download SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd coreutils
          BASE="${{ matrix.sdk_base }}"
          FILE=$(curl -fsSL "$BASE" | grep -oE 'openwrt-sdk[^"]*\.tar\.zst' | head -1)
          echo "SDK: $BASE$FILE"
          test -n "$FILE"
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 \
            --speed-time 60 --speed-limit 20000 "$BASE$FILE" -o sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)
          test -n "$SDK_DIR"
          mv "$SDK_DIR" sdk

      - name: Prepare feeds.conf
        run: |
          cd sdk
          if [ ! -f feeds.conf ]; then
            if [ -f feeds.conf.default ]; then cp feeds.conf.default feeds.conf; else touch feeds.conf; fi
          fi

      - name: Prepare package tree
        run: |
          mkdir -p sdk/package/luci-app-ups-monitor
          cp -r openwrt/. sdk/package/luci-app-ups-monitor/
          cp -r dist sdk/package/luci-app-ups-monitor/dist
          ls -la sdk/package/luci-app-ups-monitor

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cd sdk
          make defconfig 2>&1 | tee defconfig.log
          echo 'CONFIG_PACKAGE_luci-app-ups-monitor=m' >> .config
          for sym in CONFIG_SIGN_EACH_PACKAGE CONFIG_SIGN_PACKAGES CONFIG_SIGN_APK; do
            sed -i "/^${sym}=/d" .config
            echo "# ${sym} is not set" >> .config
          done
          grep -n 'luci-app-ups-monitor' .config || true
          grep -q '^CONFIG_PACKAGE_luci-app-ups-monitor=m' .config

      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          cd sdk
          # Build only this package; runtime DEPENDS (luci-base, nut-upsc)
          # are resolved by apk/opkg on the router, not compiled here.
          make -C package/luci-app-ups-monitor TOPDIR="$PWD" compile V=s -j"$(nproc)" 2>&1 | tee compile.log


      - name: Collect package
        run: |
          mkdir -p out
          find sdk/bin -type f -name 'luci-app-ups-monitor*' \
            \( -name '*.apk' -o -name '*.ipk' \) -exec cp {} out/ \;
          ls -lh out/
          if [ -z "$(ls -A out)" ]; then
            SUMMARY=$( {
              echo "config: $(grep '^CONFIG_PACKAGE_luci-app-ups-monitor' sdk/.config || echo missing)"
              echo "log lines: $(wc -l < sdk/compile.log 2>/dev/null || echo 0)"
              echo "log matches: $(grep -c 'luci-app-ups-monitor' sdk/compile.log 2>/dev/null || echo 0)"
              echo "bin dirs:"; find sdk/bin -maxdepth 3 -type d 2>/dev/null | head -6
              echo "ups files:"; find sdk/bin -iname '*ups*' 2>/dev/null | head -6
              echo "log tail:"; tail -n 6 sdk/compile.log 2>/dev/null
            } | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS="%0A" } { print }' | cut -c1-900 )
            echo "::error::no package produced :: ${SUMMARY}"
            exit 1
          fi

      - name: Report build failure
        if: failure()
        run: |
          for LOG in sdk/compile.log sdk/defconfig.log; do
            [ -s "$LOG" ] || continue
            MSG=$( { grep -nE 'Error|error:|ERROR|failed|\*\*\*|No rule' "$LOG" | tail -n 12; tail -n 6 "$LOG"; } \
              | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS="%0A" } { print }' | cut -c1-900 )
            echo "::error::${LOG}: ${MSG}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.format }}
          path: out/*
          retention-days: 30

  release:
    name: Release
    needs: package
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Prepare assets
        run: |
          cd release
          pwd
          ls -la
          test -n "$(ls -A)"
          sha256sum ./* > sha256sums.txt
          cat sha256sums.txt

      - name: Pick tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=UPS Monitor $GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=latest" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=UPS Monitor latest build" >> "$GITHUB_ENV"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            UPS Monitor 自动构建（${{ github.sha }}）。

            **安装**

            ```sh
            # ImmortalWrt / OpenWrt SNAPSHOT (apk)
            apk add --allow-untrusted ./luci-app-ups-monitor-*.apk

            # OpenWrt / ImmortalWrt 24.10 及更早 (opkg)
            opkg install ./luci-app-ups-monitor_*.ipk
            ```

            依赖 `luci-base`、`nut-upsc` 会由包管理器自动安装。安装后从 LuCI「服务 → UPS Monitor」进入，或访问 `http://<路由器IP>/ups/`。

            使用说明见仓库 README，校验值见 `sha256sums.txt`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
