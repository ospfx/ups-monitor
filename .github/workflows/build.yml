name: Build Packages

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  build-ipk:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      
      - name: Setup OpenWrt SDK
        run: |
          wget https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar xf openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mv openwrt-sdk-* openwrt-sdk
      
      - name: Prepare package files
        run: |
          mkdir -p openwrt-sdk/package/ups-monitor
          cp -r openwrt/* openwrt-sdk/package/ups-monitor/
          mkdir -p openwrt-sdk/package/ups-monitor/dist
          cp -r dist/* openwrt-sdk/package/ups-monitor/dist/
      
      - name: Build IPK
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make package/ups-monitor/compile V=s
      
      - name: Find and upload IPK
        run: |
          find openwrt-sdk/bin/packages -name "ups-monitor*.ipk" -exec cp {} ./ \;
          ls -lh *.ipk
      
      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ups-monitor-ipk-x86_64
          path: "*.ipk"
          retention-days: 30

  build-apk:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      
      - name: Setup Alpine build environment
        run: |
          docker run --rm -v $PWD:/work alpine:latest sh -c "
            apk add --no-cache alpine-sdk sudo
            adduser -D builder
            addgroup builder abuild
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            su builder -c 'abuild-keygen -a -i -n'
            cd /work
            su builder -c 'abuild checksum'
            su builder -c 'abuild -r'
          "
      
      - name: Find and upload APK
        run: |
          find ~/packages -name "ups-monitor*.apk" -exec cp {} ./ \; 2>/dev/null || echo "APK build completed"
          ls -lh *.apk || echo "No APK found in current directory"
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ups-monitor-apk-x86_64
          path: "*.apk"
          retention-days: 30
        if: always()

  release:
    needs: [build-ipk, build-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ups-monitor-ipk-x86_64/*.ipk
            ups-monitor-apk-x86_64/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
