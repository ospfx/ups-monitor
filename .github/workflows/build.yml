name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  package:
    name: Package ${{ matrix.format }}
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: apk
            sdk_base: https://downloads.immortalwrt.org/snapshots/targets/x86/64/
          - format: ipk
            sdk_base: https://downloads.immortalwrt.org/releases/24.10.4/targets/x86/64/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Download SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          BASE="${{ matrix.sdk_base }}"
          FILE=$(curl -fsSL "$BASE" | grep -oE 'immortalwrt-sdk[^"]*\.tar\.zst' | head -1)
          echo "SDK: $BASE$FILE"
          test -n "$FILE"
          curl -fsSL "$BASE$FILE" -o sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'immortalwrt-sdk-*' | head -1)
          test -n "$SDK_DIR"
          mv "$SDK_DIR" sdk

      - name: Install feed metadata
        run: |
          cd sdk
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          ./scripts/feeds update luci packages
          ./scripts/feeds install luci-base
          ./scripts/feeds install nut

      - name: Prepare package tree
        run: |
          mkdir -p sdk/package/luci-app-ups-monitor
          cp -r openwrt/. sdk/package/luci-app-ups-monitor/
          cp -r dist sdk/package/luci-app-ups-monitor/dist
          ls -la sdk/package/luci-app-ups-monitor

      - name: Configure
        run: |
          cd sdk
          make defconfig 2>&1 | tee defconfig.log
          echo 'CONFIG_PACKAGE_luci-app-ups-monitor=m' >> .config
          make defconfig 2>&1 | tee -a defconfig.log
          grep -n 'luci-app-ups-monitor' .config || true
          grep -q '^CONFIG_PACKAGE_luci-app-ups-monitor=m' .config

      - name: Compile
        run: |
          cd sdk
          make package/luci-app-ups-monitor/compile V=s -j"$(nproc)" 2>&1 | tee compile.log


      - name: Collect package
        run: |
          mkdir -p out
          find sdk/bin -type f -name 'luci-app-ups-monitor*' \
            \( -name '*.apk' -o -name '*.ipk' \) -exec cp {} out/ \;
          ls -lh out/
          if [ -z "$(ls -A out)" ]; then
            echo "::error::no package produced"
            grep -n 'luci-app-ups-monitor' sdk/.config || true
            find sdk/bin -type f 2>/dev/null | head -20 || true
            exit 1
          fi

      - name: Report build failure
        if: failure()
        run: |
          for LOG in sdk/compile.log sdk/defconfig.log; do
            [ -s "$LOG" ] || continue
            MSG=$(tail -n 12 "$LOG" | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS="%0A" } { print }' | cut -c1-900)
            echo "::error::${LOG}: ${MSG}"
          done
          echo "::error::see job log for details"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.format }}
          path: out/*
          retention-days: 30

  release:
    name: Release
    needs: package
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Prepare assets
        run: |
          cd release
          ls -lh
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Pick tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=UPS Monitor $GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=latest" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=UPS Monitor latest build" >> "$GITHUB_ENV"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            UPS Monitor 自动构建（${{ github.sha }}）。

            **安装**

            ```sh
            # ImmortalWrt / OpenWrt SNAPSHOT (apk)
            apk add --allow-untrusted ./luci-app-ups-monitor-*.apk

            # OpenWrt / ImmortalWrt 24.10 及更早 (opkg)
            opkg install ./luci-app-ups-monitor_*.ipk
            ```

            依赖 `luci-base`、`nut-upsc` 会由包管理器自动安装。安装后从 LuCI「服务 → UPS Monitor」进入，或访问 `http://<路由器IP>/ups/`。

            使用说明见仓库 README，校验值见 `sha256sums.txt`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
